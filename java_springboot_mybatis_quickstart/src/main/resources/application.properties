spring.application.name=java_springboot_mybatis_quickstart

# 配置数据库的连接信息
# 数据库访问的url地址
spring.datasource.url=jdbc:mysql://localhost:3306/web01
# 数据库驱动类类名
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 问数据库-用户名
spring.datasource.username=root
# 访问数据库-密码
spring.datasource.password=000211

# 配置mybatis的日志输出
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 指定XML文件映射配置文件的位置
mybatis.mapper-locations=classpath:com/dayu/mapper/*.xml